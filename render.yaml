# Render blueprint: one web service runs the event-sourced server (always) and the
# Codex bridge (env-gated). Apply via the Render dashboard ("New > Blueprint").
services:
  - type: web
    name: missiongraph
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Standard instance (1 CPU / 2 GB); Starter was OOM-killed twice during real worker runs.
    plan: 1c-2g
    autoDeploy: false
    healthCheckPath: /api/health
    disk:
      name: mg-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: REPORTER_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://missiongraph.vercel.app
      - key: DB_PATH
        value: /data/missiongraph.sqlite
      # Set after importing the real-run seed (see deploy/DEPLOY.md step 4):
      - key: SEED_PROJECT_ID
        sync: false
      # Flagship fleet (step 5). Dashboard-owned (sync: false): a literal value here is
      # re-applied on every Blueprint sync and silently flipped the live switch back to 0
      # when an unrelated render.yaml change was pushed. Set it to 1 in the dashboard,
      # last, after every other variable is in place.
      - key: BRIDGE_ENABLED
        sync: false
      - key: MG_PROJECT_ID
        sync: false
      - key: MG_VISITOR_TOKEN
        sync: false
      - key: MG_TARGET_REPO_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Confirm the model available to the API key ON the VM before enabling the
      # bridge (`codex -m <model> exec 'say ok'`); do not assume ChatGPT-account models.
      # Measured on the fleet arbitration harness — one template task per run: edit the repo,
      # commit, and file the full lifecycle + handoff + approval protocol. Pass means the judge
      # actually gets a review item; a run that commits but never files APPROVAL_CREATED looks
      # successful and leaves the review queue empty, which is worse than a visible failure.
      #   gpt-5.6-sol   / high    2/2 pass   ~230s      — what the laptop uses for the video
      #   gpt-5.6-sol   / medium  3/3 pass   146-208s   — chosen here: same model, cheaper effort
      #   gpt-5.4-mini  / medium  3/4 pass   156-210s   — cheapest tier, and the vaguest prose
      #   gpt-5.6-luna  / medium  2/3 pass   90-172s    — unreliable
      #   gpt-5.6-luna  / high    0/3 pass   122-168s   — more reasoning does NOT fix it
      #   gpt-5.6-luna  / low     0/1 pass   110s
      # The failures are a model property, not an effort setting: raising luna to high made it
      # worse, while sol stayed reliable at medium. Re-measure before changing this value.
      - key: MG_CODEX_MODEL
        value: gpt-5.6-sol
      - key: MG_CODEX_EFFORT
        value: medium
      # Render's container runtime forbids user namespaces, so codex's bubblewrap sandbox
      # cannot start ("bwrap: setting up uid map: Operation not permitted") and a sandboxed
      # worker exits without ever reporting. The VM therefore runs workers with the sandbox
      # off: single-tenant container, workers briefed only on their git worktree, and no
      # secret in the worker environment. Keep workspace-write wherever bubblewrap works.
      - key: MG_CODEX_SANDBOX
        value: danger-full-access
      # Judge fleet (a clone may borrow the bridge for ONE human-confirmed, template-bound task).
      # Everything below is inert while FLEET_MODE is 0 — the merged code changes nothing here.
      # Dashboard-owned for the same reason as BRIDGE_ENABLED (set to 1 for judging).
      - key: FLEET_MODE
        sync: false
      # Worst-case spend is bounded by 20 accepted requests per UTC day x judging days, so ALSO
      # set a hard spend limit on the API key itself — that limit is the backstop that does not
      # depend on this code being correct.
      - key: FLEET_DAILY_CAP
        value: "20"
      - key: FLEET_PER_PROJECT_CAP
        value: "1"
      - key: FLEET_ENQUEUE_HOURLY_CAP
        value: "3"
      - key: FLEET_GLOBAL_DAILY_CAP
        value: "40"
      - key: FLEET_ADOPT_TTL_MIN
        value: "20"
      - key: FLEET_RUN_TTL_MIN
        value: "15"
